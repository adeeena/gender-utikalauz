<div class="read-progress" aria-hidden="true"></div>
<div class="content">
  @if (entry) {
    <div class="entry-content" animate.enter="enter-fade">
      <div class="entry-markdown" (click)="onContentClick($event)" [innerHTML]="entry | utf8EmojisToImages:'apple':16"></div>
      <div class="entry-actions">
        <div class="back-to-home">
          <a [routerLink]="['/']">
            {{ 'general.backToHome' | translate }}
          </a>
        </div>
        <div class="actions">
          <button class="icon-btn" type="button" aria-label="Cikk megosztása" (click)="openShareDialog()">
            <app-icon name="share"></app-icon>
          </button>
        </div>
      </div>
      <div class="disclaimer">
        <b>{{ 'entry.foundErrorTitle' | translate }} </b>
        <span [innerHTML]="'entry.foundErrorText' | translate"></span>
      </div>
    </div>
  } @else if (entryLoading) {
    <div class="entry-state">Cikk betöltése...</div>
  } @else if (entryError) {
    <div class="entry-state entry-state-error" role="alert">
      A cikket most nem sikerült betölteni. Próbáld újra néhány pillanat múlva.
    </div>
  }
</div>

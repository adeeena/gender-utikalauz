<div class="sidebar-container">
  <div class="sidebar-title">
    {{ 'sidebar.title' | translate }}
  </div>

  <a [routerLink]="['/']" class="back-to-home" (click)="linkClicked()">
    {{ 'general.backToHome' | translate }}
  </a>

  <div class="sidebar-item-container">
    @for (category of categories; track category) {
      <div class="category">
        <div class="category-title" [innerHTML]="category.title | utf8EmojisToImages:'apple':14">
        </div>
        @for (subcategory of category.children; track subcategory) {
          <a [routerLink]="[subcategory.id ? subcategory.id : '/entry']"
            [queryParams]="subcategory.id ? null : { id: subcategory.entryId }"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'subset', fragment: 'ignored', matrixParams: 'ignored' }"
            (click)="linkClicked()"
            class="sidebar-item">
            <span class="text">{{subcategory.title}}</span>
          </a>
        }
      </div>
    }
  </div>
</div>

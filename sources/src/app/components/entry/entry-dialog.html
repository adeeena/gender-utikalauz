<div class="dialog-panel">
  <h2>{{ 'entry.share' | translate }}</h2>
  <input class="dialog-input" readonly aria-label="A cikk megosztási címe" onfocus="this.select()" [value]="data.link"/>
  <div class="dialog-actions">
    <button class="btn btn-secondary" type="button" (click)="onClick()">{{ 'general.close' | translate }}</button>
  </div>
</div>
